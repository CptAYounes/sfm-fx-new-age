name: Feature or improvement
description: Propose a focused improvement with explicit limitations.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and evidence
      description: How can we test it offline? Describe source, authority or compatibility implications. Do not claim guaranteed trading returns.
    validations:
      required: true
