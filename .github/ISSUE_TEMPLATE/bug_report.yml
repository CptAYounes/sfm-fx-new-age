name: Bug report
description: Report a reproducible software problem using non-sensitive inputs.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never upload credentials, account records, databases, private paths or native captures. Report vulnerabilities privately via SECURITY.md."
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Commit/release, OS, Python and Qt versions; offline or explicitly configured mode.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Exact steps using synthetic or redistributable non-private input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, account identifiers and personal information first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, account identifiers, private paths and private data.
          required: true
