name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests and build (Python 3.13)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-py313.txt
      - name: Install Qt runtime and documentation utilities
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgl1 libegl1 libopengl0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libdbus-1-3 libfontconfig1 libglib2.0-0t64 fonts-dejavu-core poppler-utils
      - name: Install reference development environment
        run: |
          python -m pip install -c requirements/constraints-py313.txt -e '.[dev,ctrader,docs]'
          python -m pip check
      - name: Architecture, offline checkpoint and runtime summary
        run: |
          python -m sfm_fx_new_age --check
          python -m sfm_fx_new_age --offline-checkpoint
          python -m sfm_fx_new_age --summary-json
      - name: Full offline regression suite
        run: python -m pytest tests -q --junitxml=test-results.xml
      - name: Verify portable documentation and source integrity
        run: python scripts/verify_publication.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Independently installed wheel security regressions
        shell: bash
        run: |
          set -euo pipefail
          wheel_test_root="$RUNNER_TEMP/sfm-installed-wheel"
          mkdir -p "$wheel_test_root/tests"
          python -m venv "$wheel_test_root/venv"
          wheel_python="$wheel_test_root/venv/bin/python"
          wheels=("$GITHUB_WORKSPACE"/dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$wheel_python" -m pip install -c requirements/constraints-py313.txt "${wheels[0]}[dev,ctrader]"
          "$wheel_python" -m pip check
          cp tests/test_oauth_security.py "$wheel_test_root/tests/"
          cd "$wheel_test_root"
          unset PYTHONPATH
          "$wheel_python" -I -c 'from pathlib import Path; import sys, sfm_fx_new_age; p = Path(sfm_fx_new_age.__file__).resolve(); assert p.is_relative_to(Path(sys.prefix).resolve()), p; print("Verified installed package:", p)'
          "$wheel_python" -m sfm_fx_new_age --check
          "$wheel_python" -m sfm_fx_new_age --offline-checkpoint
          "$wheel_python" -m pytest tests -q --junitxml="$GITHUB_WORKSPACE/installed-wheel-test-results.xml"
      - name: Upload test report and distribution artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python313-test-and-build
          path: |
            test-results.xml
            installed-wheel-test-results.xml
            dist/*
          if-no-files-found: warn
          retention-days: 14

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$RUNNER_TEMP/$archive"
          expected=$(python -c 'import json; print(json.load(open(".github/gitleaks-release.json"))["sha256"])')
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan committed history without printing secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner'
